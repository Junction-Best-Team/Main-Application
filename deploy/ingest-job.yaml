# Run migrate and seed once with the same image BEFORE this Job. Never on pod startup.
# Existing PVC contains the verified complete challenge snapshot; no raw data in the image.
apiVersion: batch/v1
kind: Job
metadata:
  name: aimo-ingest-replace-with-generation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: ingest
          image: registry.example.invalid/aimo:worker-REPLACE_WITH_COMMIT
          args: [ingest, --file, /data/valio_aimo_junction26_product_data.json]
          envFrom: [{configMapRef: {name: aimo-config}}, {secretRef: {name: aimo-worker-runtime}}]
          resources:
            requests: {cpu: "1", memory: "2Gi"}
            limits: {cpu: "4", memory: "4Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: catalog, mountPath: /data, readOnly: true}]
      volumes:
        - name: catalog
          persistentVolumeClaim: {claimName: aimo-existing-catalog}
