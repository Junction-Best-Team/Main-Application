# Existing cluster only; supply images, hostname, configuration and Secrets first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimo-frontend
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: aimo-frontend}
  template:
    metadata:
      labels: {app: aimo-frontend, app.kubernetes.io/part-of: aimo, app.kubernetes.io/component: frontend}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: registry.example.invalid/aimo:frontend-REPLACE_WITH_COMMIT
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: "50m", memory: 32Mi}
            limits: {cpu: "2", memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: aimo-frontend
spec:
  selector: {app: aimo-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimo-api
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: aimo-api}
  template:
    metadata:
      labels: {app: aimo-api, app.kubernetes.io/part-of: aimo, app.kubernetes.io/component: api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.example.invalid/aimo:api-REPLACE_WITH_COMMIT
          args: [serve]
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: aimo-worker-runtime, key: GEMINI_API_KEY, optional: true}
          envFrom:
            - configMapRef: {name: aimo-config}
            - secretRef: {name: aimo-runtime}
          ports: [{name: http, containerPort: 8000}]
          resources:
            requests: {cpu: "100m", memory: 192Mi}
            limits: {cpu: "2", memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: database-ca, mountPath: /etc/aimo-db, readOnly: true}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: database-ca
          secret: {secretName: aimo-database-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: aimo-api
spec:
  selector: {app: aimo-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimo-worker
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: aimo-worker}
  template:
    metadata:
      labels: {app: aimo-worker, app.kubernetes.io/part-of: aimo, app.kubernetes.io/component: worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: registry.example.invalid/aimo:worker-REPLACE_WITH_COMMIT
          args: [worker]
          envFrom:
            - configMapRef: {name: aimo-config}
            - secretRef: {name: aimo-worker-runtime}
          ports: [{name: http, containerPort: 8001}]
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: database-ca, mountPath: /etc/aimo-db, readOnly: true}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: database-ca
          secret: {secretName: aimo-database-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: aimo-worker
spec:
  selector: {app: aimo-worker}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aimo
spec:
  ingressClassName: REPLACE_WITH_EXISTING_CLASS
  tls:
    - hosts: [aimo.example.invalid]
      secretName: aimo-existing-tls
  rules:
    - host: aimo.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aimo-frontend
                port: {name: http}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aimo-api
                port: {name: http}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: aimo-api
                port: {name: http}
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: aimo-api
                port: {name: http}
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: aimo-api
                port: {name: http}
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: aimo-api
                port: {name: http}
