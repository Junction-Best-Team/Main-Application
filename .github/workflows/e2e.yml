name: End-to-end

# Slower than ci.yml, so a separate workflow: starts the real server on a throwaway database with
# fixture data and runs (1) the black-box sweep of all eight agent tools plus the buyer approval,
# rejection and separation controls, and (2) the Playwright browser tests in real Chromium.
# Lint and pytest already run in ci.yml. Never uses the Valio API key; commercial data is fixture.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Tool sweep and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aimo
          POSTGRES_PASSWORD: aimo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aimo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_URL: postgresql://aimo:aimo@localhost:5432/aimo_ci
      UV_NO_SYNC: '1'
      PLAYWRIGHT_DEPS: '1'
      SWEEP_ARGS: --strict
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          python-version: '3.12.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies without the ML stack
        run: |
          uv export --locked --prune torch --prune sentence-transformers --no-emit-project --output-file "$RUNNER_TEMP/aimo-e2e-requirements.txt"
          uv venv
          uv pip sync --require-hashes "$RUNNER_TEMP/aimo-e2e-requirements.txt"
          uv pip install --no-deps -e .
      - name: Sweep and browser tests (tests/ci.sh)
        run: tests/ci.sh --skip-unit --browser
      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
