name: CI

# One workflow, organised as parallel jobs. Required status checks (branch protection) are
# "Detect application components", "Python lint and tests", "Frontend types and build" and
# "CI gate". The gate waits for EVERY job below (tests, sweep, browser, coverage, terraform), so a
# new job only needs adding to the gate's `needs` and `applies` table to become required.
#
# TODO (local note, see TODO.local.md): any build/deploy workflow must start only after this
# workflow succeeded on the same commit (workflow_run with conclusion == success, or a
# `needs: ci / CI gate` style dependency) and never on a failing or skipped CI.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main release halfway through its deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  components:
    name: Detect application components
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      terraform: ${{ steps.terraform.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          # develop is documentation-only until the MVP PR merges.
          # Incomplete application manifests must fail rather than skip checks.
          if [[ -f pyproject.toml || -f uv.lock || -d src || -d tests ]]; then
            test -f pyproject.toml
            test -f uv.lock
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No backend application yet; backend checks skipped.'
          fi
          if [[ -d frontend ]]; then
            test -f frontend/package.json
            test -f frontend/package-lock.json
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No frontend application yet; frontend checks skipped.'
          fi
      - id: terraform
        name: Detect infrastructure changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            range="$PR_BASE...$PR_HEAD"
          elif [[ "$EVENT_NAME" == push && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            range="$PUSH_BASE..$PUSH_HEAD"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Include deletions/renames and changes to either CI workflow.
          if git diff --quiet --no-renames "$range" -- infra/ .github/workflows/ci.yml .github/workflows/terraform.yml .github/workflows/deploy.yml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 1 ]]; then exit "$status"; fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  terraform:
    name: Terraform
    needs: components
    if: needs.components.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform.yml

  backend:
    name: Python lint and tests
    needs: components
    if: needs.components.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aimo
          POSTGRES_PASSWORD: aimo
          POSTGRES_DB: aimo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aimo -d aimo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aimo:aimo@localhost:5432/aimo_test
      EMBEDDING_BACKEND: fixture
      UPSTREAM_MODE: fixture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Lint Python
        run: .venv/bin/ruff check src tests scripts
      - name: Test backend against PostgreSQL and fixture data
        run: COVERAGE_FILE=.coverage/pytest .venv/bin/pytest -q --cov --cov-fail-under=0
        # The 95% gate applies to the combined total in the Coverage job, not to pytest alone.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-pytest
          path: .coverage/pytest
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend types and build
    needs: components
    if: needs.components.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check TypeScript and build production assets
        run: npm run build

  sweep:
    name: Tool sweep
    needs: components
    if: needs.components.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aimo
          POSTGRES_PASSWORD: aimo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aimo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_URL: postgresql://aimo:aimo@localhost:5432/aimo_ci
      UV_NO_SYNC: '1'
      CI_COVERAGE: '1'
      SWEEP_ARGS: --strict
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Black-box sweep of all eight agent tools, MCP and the buyer controls
        run: tests/ci.sh --skip-unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-sweep
          path: .coverage/sweep.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser tests
    needs: components
    if: needs.components.outputs.backend == 'true' && needs.components.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aimo
          POSTGRES_PASSWORD: aimo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aimo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_URL: postgresql://aimo:aimo@localhost:5432/aimo_ci
      UV_NO_SYNC: '1'
      CI_COVERAGE: '1'
      PLAYWRIGHT_DEPS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright browser tests against the built UI (real Chromium)
        run: tests/ci.sh --skip-unit --no-sweep --browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-browser
          path: .coverage/sweep.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore

  coverage:
    name: Coverage (95% minimum)
    needs: [components, backend, sweep, browser]
    if: >-
      ${{ always()
      && needs.components.outputs.backend == 'true'
      && needs.backend.result == 'success'
      && needs.sweep.result == 'success'
      && (needs.browser.result == 'success' || needs.browser.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: .coverage
          merge-multiple: true
      - name: Combine pytest, sweep and browser coverage and enforce fail_under (pyproject.toml)
        run: .venv/bin/python tests/coverage_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: |
            .coverage/html
            .coverage/coverage.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: CI gate
    needs: [components, backend, frontend, terraform, sweep, browser, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs["components"]["result"] != "success":
              sys.exit("Component/change detection did not succeed.")
          # Which detection output switches each job on. A job that is not applicable must be
          # skipped; an applicable job must succeed (a skipped or failed dependency fails the gate).
          applies = {
              "backend": ["backend"],
              "frontend": ["frontend"],
              "terraform": ["terraform"],
              "sweep": ["backend"],
              "browser": ["backend", "frontend"],
              "coverage": ["backend"],
          }
          outputs = needs["components"]["outputs"]
          for job, flags in applies.items():
              for flag in flags:
                  if outputs.get(flag) not in ("true", "false"):
                      sys.exit(f"Missing or invalid detection output for {flag}.")
              enabled = all(outputs[flag] == "true" for flag in flags)
              expected = "success" if enabled else "skipped"
              actual = needs[job]["result"]
              if actual != expected:
                  sys.exit(f"{job}: expected {expected}, got {actual}.")
              print(f"{job}: {actual}")
          PY

  release:
    name: Build and deploy release
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      deploy: ${{ vars.DEPLOY_ENABLED == 'true' }}
    secrets:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
