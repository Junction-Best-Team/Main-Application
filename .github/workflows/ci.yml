name: CI

# Validate PRs before merging. Protected main pushes build releases without repeating CI.
# Keep the existing check names for repository rules; skip only unrelated jobs.
# The release PR (develop into main) runs the backend job with the FULL test suite; PRs into
# develop run the core subset in tests/pr-tests.sh.

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  components:
    name: Detect application components
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      terraform: ${{ steps.changes.outputs.changed }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        name: Detect affected checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PROMOTE_DEVELOP: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # Protected develop already required contribution CI, so promotion repeats only the backend,
          # and runs it with the full test suite (full=true): the release PR is the one place where
          # every test must pass. Frontend and Terraform are not repeated.
          if [[ "$PROMOTE_DEVELOP" == true ]]; then
            printf 'backend=true\nfrontend=false\nchanged=false\nfull=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            range="$PR_BASE...$PR_HEAD"
          else
            printf 'backend=true\nfrontend=true\nchanged=true\nfull=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed on diff errors; include both sides of renames and deleted files.
          git diff --name-only --no-renames -z "$range" > "$RUNNER_TEMP/ci-paths"
          backend=false frontend=false terraform=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/*) backend=true; frontend=true; terraform=true ;;
              frontend/openapi.json) backend=true; frontend=true ;;
              frontend/*) frontend=true ;;
              src/*|scripts/*) backend=true; frontend=true ;;
              tests/*|migrations/*|pyproject.toml|uv.lock) backend=true ;;
              infra/*) terraform=true ;;
              docs/*|*.md) ;;
              *) backend=true; frontend=true ;;
            esac
          done < "$RUNNER_TEMP/ci-paths"
          printf 'backend=%s\nfrontend=%s\nchanged=%s\nfull=false\n' "$backend" "$frontend" "$terraform" >> "$GITHUB_OUTPUT"

  terraform:
    name: Terraform
    needs: components
    if: needs.components.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform.yml

  backend:
    name: Python lint and tests
    needs: components
    if: needs.components.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aimo
          POSTGRES_PASSWORD: aimo
          POSTGRES_DB: aimo_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U aimo -d aimo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aimo:aimo@localhost:5432/aimo_test
      EMBEDDING_BACKEND: fixture
      UPSTREAM_MODE: fixture
      CI_DATABASE_URL: postgresql://aimo:aimo@localhost:5432/aimo_ci
      UV_NO_SYNC: '1'
      SWEEP_ARGS: --strict
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Lint Python
        run: .venv/bin/ruff check src tests scripts
      - name: Test core app flows (the full suite for the release PR and manual runs)
        run: tests/pr-tests.sh ${{ needs.components.outputs.full == 'true' && '--full' || '' }}
      - name: Black-box sweep of the buyer-facing API (sign-in, CSRF, conversations, purchases)
        run: tests/ci.sh --skip-unit

  frontend:
    name: Frontend types and build
    needs: components
    if: needs.components.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check TypeScript and build production assets
        run: npm run build

  gate:
    name: CI gate
    needs: [components, backend, frontend, terraform]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable check to pass
        env:
          COMPONENTS_RESULT: ${{ needs.components.result }}
          BACKEND_CHANGED: ${{ needs.components.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_CHANGED: ${{ needs.components.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TERRAFORM_CHANGED: ${{ needs.components.outputs.terraform }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          [[ "$COMPONENTS_RESULT" == success ]] || exit 1
          check() {
            case "$1:$2" in
              true:success|false:skipped) ;;
              *) echo "Unexpected check result: changed=$1 result=$2"; return 1 ;;
            esac
          }
          check "$BACKEND_CHANGED" "$BACKEND_RESULT"
          check "$FRONTEND_CHANGED" "$FRONTEND_RESULT"
          check "$TERRAFORM_CHANGED" "$TERRAFORM_RESULT"
