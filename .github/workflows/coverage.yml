name: Coverage

# Measures and gates Python coverage of src/aimo (pytest + the black-box sweep against a real server).
# Separate from ci.yml on purpose: ci.yml stays the fast quick pipeline. Threshold: `fail_under` in
# pyproject.toml ([tool.coverage.report]). Local run and details: tests/README.md ("Coverage").
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-coverage:
    name: Python coverage (pytest + sweep) and threshold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aimo
          POSTGRES_PASSWORD: aimo
          POSTGRES_DB: aimo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aimo -d aimo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/ci.sh creates the aimo_ci database itself; the name must end in _ci.
      TEST_DATABASE_URL: postgresql://aimo:aimo@localhost:5432/aimo_test
      CI_DATABASE_URL: postgresql://aimo:aimo@localhost:5432/aimo_ci
      EMBEDDING_BACKEND: fixture
      UPSTREAM_MODE: fixture
      CI_COVERAGE: '1'
      UV_NO_SYNC: '1' # use the pruned .venv; never let `uv run` pull torch/sentence-transformers
      SWEEP_PORT: '8765'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          python-version: '3.12.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked test dependencies without the ML stack
        run: |
          uv export --locked --prune torch --prune sentence-transformers --no-emit-project --output-file "$RUNNER_TEMP/aimo-ci-requirements.txt"
          uv venv
          uv pip sync --require-hashes "$RUNNER_TEMP/aimo-ci-requirements.txt"
          uv pip install --no-deps -e .
      - name: Lint, pytest and black-box sweep under coverage
        run: tests/ci.sh
      - name: Combine, report and enforce the threshold
        run: .venv/bin/python tests/coverage_report.py
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-coverage
          path: |
            .coverage/html
            .coverage/coverage.xml
          if-no-files-found: ignore
          retention-days: 14
