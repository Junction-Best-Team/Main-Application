name: Build and deploy

on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
    secrets:
      DIGITALOCEAN_TOKEN:
        required: false
      LLM_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the bootstrapped demo cluster (leave off for first image)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: junction-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, frontend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check application source and choose image name
        id: image
        run: |
          test -f Dockerfile || { echo '::error::Merge the MVP application before releasing.'; exit 1; }
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ matrix.component }}-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          echo "$IMAGE" > "${{ matrix.component }}.image"
          echo "Published ${{ matrix.component }}: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Deployment runs only when enabled and the demo cluster is bootstrapped.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.image
          retention-days: 7

  deploy:
    needs: build
    if: inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      DIGITALOCEAN_CLUSTER_ID: ${{ vars.DIGITALOCEAN_CLUSTER_ID }}
      NAMESPACE: ${{ vars.DEPLOY_NAMESPACE || 'junction' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4.1-mini' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: release-images
      - name: Load the three immutable image references
        run: |
          echo "IMAGE=$(cat release-images/api.image)" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=$(cat release-images/worker.image)" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$(cat release-images/frontend.image)" >> "$GITHUB_ENV"
      - name: Check deployment configuration
        id: config
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/junction-kubeconfig.yaml" >> "$GITHUB_ENV"
          echo "ACCESS_STATE=$RUNNER_TEMP/junction-runner-access.json" >> "$GITHUB_ENV"
          test -n "$DIGITALOCEAN_TOKEN" || { echo '::error::Set the DIGITALOCEAN_TOKEN repository secret.'; exit 1; }
          test -n "$DIGITALOCEAN_CLUSTER_ID" || { echo '::error::Set the DIGITALOCEAN_CLUSTER_ID repository variable.'; exit 1; }
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.10
      - name: Temporarily allow this runner and get short-lived cluster credentials
        run: python3 infra/scripts/ci-cluster-access.py open
      - name: Configure the server-side conversational provider
        id: llm
        run: python3 infra/scripts/sync-llm-secret.py
      - name: Update image and wait for readiness
        env:
          LLM_REFRESHED: ${{ steps.llm.outputs.changed }}
        run: bash infra/scripts/deploy-app.sh
      - name: Remove temporary API access and local credentials
        if: always() && steps.config.outcome == 'success'
        run: |
          rm -f "$KUBECONFIG"
          python3 infra/scripts/ci-cluster-access.py close
