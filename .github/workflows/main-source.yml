name: Main source branch

# Required status check on `main`: only `develop` may be merged into it.
on:
  # Use the trusted default-branch workflow so a PR cannot edit its own guard.
  # Keep this metadata-only: never check out or execute code from the PR.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  develop-only:
    name: Main accepts develop only
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require head branch develop
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs into main must come from develop in this repository (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
