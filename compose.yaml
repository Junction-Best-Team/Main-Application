services:
  db:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: aimo
      POSTGRES_PASSWORD: aimo
      POSTGRES_DB: aimo
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimo"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., target: api}
    environment:
      DATABASE_URL: postgresql://aimo:aimo@db:5432/aimo
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      APPROVAL_SESSION_SECRET: ${APPROVAL_SESSION_SECRET:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      UPSTREAM_MODE: ${UPSTREAM_MODE:-fixture}
      VALIO_AIMO_API_KEY: ${VALIO_AIMO_API_KEY:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30
    profiles: [app]
  worker:
    build: {context: ., target: worker}
    environment:
      DATABASE_URL: postgresql://aimo:aimo@db:5432/aimo
      UPSTREAM_MODE: ${UPSTREAM_MODE:-fixture}
      VALIO_AIMO_API_KEY: ${VALIO_AIMO_API_KEY:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 60
    stop_grace_period: 120s
    profiles: [app]
  frontend:
    build: {context: ., target: frontend}
    ports: ["127.0.0.1:8000:8080"]
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
    profiles: [app]
volumes:
  postgres:
