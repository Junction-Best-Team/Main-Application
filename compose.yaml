services:
  db:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: aimo
      POSTGRES_PASSWORD: aimo
      POSTGRES_DB: aimo
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimo"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., target: api}
    environment:
      DATABASE_URL: postgresql://aimo:aimo@db:5432/aimo
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      APPROVAL_SESSION_SECRET: ${APPROVAL_SESSION_SECRET:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      UPSTREAM_MODE: ${UPSTREAM_MODE:-fixture}
      VALIO_AIMO_API_KEY: ${VALIO_AIMO_API_KEY:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-google}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30
    profiles: [app]
  worker:
    build: {context: ., target: worker}
    environment:
      DATABASE_URL: postgresql://aimo:aimo@db:5432/aimo
      UPSTREAM_MODE: ${UPSTREAM_MODE:-fixture}
      VALIO_AIMO_API_KEY: ${VALIO_AIMO_API_KEY:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-google}
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      GUARDRAIL_PROVIDER: ${GUARDRAIL_PROVIDER:-google}
      GUARDRAIL_MODE: ${GUARDRAIL_MODE:-enforce}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      RECIPE_IMAGES_ENABLED: ${RECIPE_IMAGES_ENABLED:-true}
      RECIPE_IMAGE_MODEL: ${RECIPE_IMAGE_MODEL:-gemini-nano-banana-2.1}
      RECIPE_IMAGE_TIMEOUT_SECONDS: ${RECIPE_IMAGE_TIMEOUT_SECONDS:-45}
      RECIPE_IMAGE_HOURLY_LIMIT: ${RECIPE_IMAGE_HOURLY_LIMIT:-5}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-gemini-4-carbon}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-low}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-8192}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-15}
      SEARCH_MAX_ATTEMPTS: ${SEARCH_MAX_ATTEMPTS:-2}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_WORKERS: ${EMBEDDING_WORKERS:-4}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-30}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 60
    stop_grace_period: 120s
    profiles: [app]
  frontend:
    build: {context: ., target: frontend}
    ports: ["127.0.0.1:8000:8080"]
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
    profiles: [app]
volumes:
  postgres:
