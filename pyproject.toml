[project]
name = "aimo-gateway"
version = "0.1.0"
description = "Authenticated chat purchasing with verified baskets and mock orders"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
  "sentence-transformers>=5,<6",
  "torch>=2.5,<3",
  "argon2-cffi>=25,<26",
  "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]

[project.scripts]
aimo = "aimo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# CPU-only runtime on Linux; macOS uses its native PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# Coverage: `tests/README.md` ("Coverage") explains how this is used.
# The threshold is `fail_under` below; it is applied by `coverage report`, not by pytest.
[tool.coverage.run]
source = ["aimo"]
branch = true
parallel = true            # one data file per process, merged with `coverage combine`
relative_files = true
sigterm = true             # the sweep stops uvicorn with SIGTERM; still write its data
data_file = ".coverage/data"

[tool.coverage.paths]
# Map the installed/editable copy and any CI checkout path onto src/aimo for `combine`.
source = ["src/aimo", "*/src/aimo", "*/site-packages/aimo"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = [
  'if __name__ == "__main__":',
]

[tool.coverage.html]
directory = ".coverage/html"
