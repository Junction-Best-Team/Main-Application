server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health/live { access_log off; return 200 'ok'; }
    location = /health/ready { access_log off; try_files /index.html =503; }
    location /assets/ { try_files $uri =404; }
    # API paths are routed directly by ingress; never serve HTML for an API error.
    location /api { return 404; }
    add_header Cache-Control no-cache always;
    location / { try_files $uri /index.html; }
}
