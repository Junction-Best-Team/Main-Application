server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://generativelanguage.googleapis.com; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # TLS ends at the ingress; browsers ignore this header on a plain-HTTP response.
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /health/live { access_log off; return 200 'ok'; }
    location = /health/ready { access_log off; try_files /index.html =503; }
    # Build output is content-hashed, so a changed file always has a new name: cache it for a year.
    # ^~ keeps the extension rule below from taking these files. add_header in a location replaces
    # every inherited add_header, so the headers are repeated here.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://generativelanguage.googleapis.com; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # No "always": a missing asset (404) must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # API paths are routed directly by ingress; never serve HTML for an API error.
    location /api { return 404; }
    add_header Cache-Control no-cache always;
    # The API's documentation is never served from here either (Q-72); without this rule /redoc
    # and, once the ingress stops routing them to the API, /docs and /openapi.json would answer
    # with the index page. Must precede the extension rule below.
    location ~* ^/(docs|redoc|openapi\.json)(/|$) { return 404; }
    # A missing file (favicon, robots.txt, a mistyped .html) is a real 404, not the index page.
    location ~* \.(?:ico|txt|xml|html|map|json|png|jpe?g|gif|svg|webp|woff2?|css|js)$ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
