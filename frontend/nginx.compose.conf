server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://generativelanguage.googleapis.com; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health/live { access_log off; return 200 'ok'; }
    location = /health/ready { access_log off; try_files /index.html =503; }
    location /assets/ { try_files $uri =404; }
    # API paths are routed directly by ingress; never serve HTML for an API error.
    location ~ ^/(api|docs|openapi\.json|mcp)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    add_header Cache-Control no-cache always;
    location / { try_files $uri /index.html; }
}
